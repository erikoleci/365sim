# 365sim në PC-në lokale: Postgres me të dhëna të përhershme + aplikacioni + link publik (Cloudflare Tunnel).
# Nisja:  docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
# Të gjitha shërbimet kanë "restart: unless-stopped": kur ndizet PC-ja (dhe Docker Desktop), ngrihen vetë.
# Të dhënat (përdorues, bileta) jenë në volumin "sim365_pgdata" -- mbijetojnë fikjes/rindezjes së PC-së.
# MOS përdor "docker compose down -v" (fshin volumin dhe me të të gjitha biletat).
name: sim365

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sim365
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?vendos POSTGRES_PASSWORD në .env.local}
      POSTGRES_DB: sim365
    volumes:
      - sim365_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim365 -d sim365"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Nuk botohet jashtë (vetëm aplikacioni e arrin brenda rrjetit të Docker).

  app:
    build: .
    image: sim365-app:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:?vendos JWT_SECRET në .env.local}
      DATABASE_URL: postgresql://sim365:${POSTGRES_PASSWORD}@db:5432/sim365?sslmode=disable
      LONDON365_ENABLED: "1"
      # Katalogu pa kufizime: çdo vend, çdo ligë (përfshirë divizionet e dyta dhe ligat rajonale), çdo ndeshje.
      # Pa këtë, aplikohen parazgjedhjet: vetëm 5 vende, vetëm ligat kryesore, pa divizione të dyta.
      LONDON365_ALL_MATCHES: "1"
      # /api/matches: faqe me 200 rreshta -> 40 faqe = 8 000 rreshta (1000 faqe e bënte listën 17-30 s dhe jepte 503; parazgjedhja është 30)
      MATCHES_PAGE_HARD_CAP: "40"
      # Ndeshjet live mbahen sa i ka feed-i (parazgjedhja 4 orë i heq ato që feed-i i braktis)
      LIVE_MAX_AGE_HOURS: "24"
      # Më shumë rreshta paralelë për sinkronizimin live kur ka shumë ndeshje; pool-i i DB duhet të jetë >= rreshtat
      LONDON365_LIVE_CONCURRENCY: "20"
      LONDON365_LIVE_CONCURRENCY_MAX: "60"
      PG_POOL_MAX: "40"
      # Only markets the system can settle by itself are offered (no ticket can be accepted that nobody can close).
      BET_REQUIRE_SETTLEMENT_RULE: "1"
    ports:
      - "127.0.0.1:3001:3001"   # http://localhost:3001 vetëm nga kjo PC

  # Ndërron fjalëkalimet e njohura admin/admin, root/root, user/user (vetëm nëse janë ende ato).
  secure:
    image: sim365-app:local
    depends_on:
      app:
        condition: service_healthy
    restart: "no"
    environment:
      DATABASE_URL: postgresql://sim365:${POSTGRES_PASSWORD}@db:5432/sim365?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?vendos ADMIN_PASSWORD në .env.local}
      AGENT_PASSWORD: ${AGENT_PASSWORD:-}
    command: ["node", "local/secure-accounts.js"]

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://app:3001"]

  notifier:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - tunnel
    environment:
      TUNNEL_METRICS: http://tunnel:2000
      OUT_FILE: /out/CURRENT_LINK.txt
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./local/notify-url.sh:/notify-url.sh:ro
      - ./local-data:/out
    command: ["sh", "-c", "apk add --no-cache curl >/dev/null && sh /notify-url.sh"]

volumes:
  sim365_pgdata:
